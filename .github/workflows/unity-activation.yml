name: Unity Activation File

# UNITY_LICENSE 시크릿을 처음 만들 때만 수동으로 실행한다.
# 생성된 .alf를 license.unity3d.com/manual에 올려 받은 .ulf 내용이 시크릿 값이 된다.
on:
  workflow_dispatch:

jobs:
  activation:
    name: Request .alf
    runs-on: ubuntu-latest
    steps:
      - uses: game-ci/unity-request-activation-file@v2
        id: alf
        with:
          unityVersion: 6000.4.0f1

      - uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: ${{ steps.alf.outputs.filePath }}
